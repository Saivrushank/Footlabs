    <style>

        .custom-color-text { background: rgba(255,255,255,0.9); padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #111; text-transform: uppercase; letter-spacing: 1px; pointer-events: none; }

        #checkout-modal.visible { display: flex; opacity: 1; }

        .receipt-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #111; padding-bottom: 20px;}

</head>
<body>

    <div id="error-log"></div>

<script>
// ==========================================
// 🛠️ ONSHAPE ALIGNMENT CONTROLS 🛠️
// Z-axis rotation removed. Restored to perfect alignment.
// ==========================================
const ONSHAPE_ALIGN = {
    'sole':  { x: 0, y: 0, z: 0 },
    'upper': { x: -Math.PI / 2, y: 0, z: 0 }, 
    'laces': { x: -Math.PI / 2, y: 0, z: 0 }  
};
// ==========================================

function triggerRedAlert(message) {
    const log = document.getElementById('error-log');
    log.style.display = 'block';
    log.innerHTML += "⚠️ " + message + "<br>";
    document.getElementById('loading-screen').style.opacity = '0';
}

window.addEventListener('error', function(event) {
    triggerRedAlert("FATAL SYSTEM CRASH: " + event.message);
});

document.addEventListener('contextmenu', e => {
    if(e.target.tagName !== 'INPUT') e.preventDefault();
});

let currentMode = 'template';
let userActivity = 'casual', userPronation = 'neutral';
let basePrice = 120, partMaterials = {}; 
let proceduralTextures = {}; 
let designerCurrentStep = 1;

let shoeModules = { sole: null, upper: null, laces: null };

function showToast(message) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'sys-toast';
    toast.innerHTML = "<b>[SYS]</b> " + message;
    container.appendChild(toast);
    setTimeout(() => { toast.classList.add('toast-out'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function nextStep(current, next) {
    document.getElementById('wiz-' + current).classList.remove('active');
    document.getElementById('wiz-' + current).classList.add('exit');
    document.getElementById('wiz-' + next).classList.remove('exit');
    document.getElementById('wiz-' + next).classList.add('active');
    document.getElementById('dot-' + current).classList.remove('active');
    document.getElementById('dot-' + next).classList.add('active');
}

let scene, camera, renderer, controls, shoe;
let activePart = null, hoveredPart = null, selectableParts = [];
const manager = new THREE.LoadingManager();
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function launchStudio(mode) {
    currentMode = mode;
    userActivity = document.getElementById('usr-activity').value;
    userPronation = document.getElementById('usr-pronation').value;
    
    document.getElementById('mode-badge').innerText = mode.toUpperCase() + (mode==='designer'?" BUILD":" MODE");
    
    if(mode === 'designer') {
        document.getElementById('instruction-text').style.display = 'none';
        document.getElementById('active-part-display').style.display = 'none';
        document.getElementById('designer-header').style.display = 'block';
        document.getElementById('checkout-footer').style.display = 'none';
        document.getElementById('designer-nav').style.display = 'flex';
        document.getElementById('advanced-textures').style.display = 'flex';
    } else if (mode === 'advanced') {
        document.getElementById('advanced-textures').style.display = 'flex';
    }

    const onboardElement = document.getElementById('onboarding');
    onboardElement.classList.add('hidden');
    setTimeout(() => { onboardElement.style.display = 'none'; }, 800); 

    document.getElementById('workspace').classList.add('visible');
    document.getElementById('loading-screen').style.display = 'flex';
    document.getElementById('loading-screen').style.opacity = '1';
    
    if(mode !== 'template') generateTextures(); 
    init3DEnvironment();
    calculatePrice(); 
}

function init3DEnvironment() {
    const container = document.getElementById('canvas-container');
    
    if(scene) {
        while(container.firstChild) container.removeChild(container.firstChild);
    }
    
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 4, 12); 

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 5;
    controls.maxDistance = 20;
    controls.enablePan = false; 
    controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
    controls.maxPolarAngle = Math.PI / 2; 
    controls.target.set(-1.5, 0, 0); 
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
    keyLight.position.set(10, 15, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);
    
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(-10, 10, -10);
    scene.add(fillLight);

    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.1 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1;
    floor.receiveShadow = true;
    scene.add(floor);

    shoe = new THREE.Group();
    scene.add(shoe);

    const loader = new THREE.GLTFLoader(manager);

    let expectedFiles = 0;
    let loadedFiles = 0;

    const checkAllLoaded = () => {
        loadedFiles++;
        if (loadedFiles === expectedFiles) finalizeEngineSetup();
    };

    const loadModule = (filename, category, isMonolithic = false) => {
        expectedFiles++;
        loader.load('models/' + filename, (gltf) => {
            let rawGroup = gltf.scene;
            
            if (!isMonolithic) {
                // Apply perfectly synced alignments
                rawGroup.rotation.x = ONSHAPE_ALIGN[category].x;
                rawGroup.rotation.y = ONSHAPE_ALIGN[category].y;
                rawGroup.rotation.z = ONSHAPE_ALIGN[category].z;
                rawGroup.updateMatrixWorld(true);

                let box = new THREE.Box3().setFromObject(rawGroup);
                let center = new THREE.Vector3();
                box.getCenter(center);

                rawGroup.position.set(-center.x, -center.y, -center.z);
                rawGroup.updateMatrixWorld(true);

                let wrapper = new THREE.Group();
                wrapper.userData.category = category;
                wrapper.userData.name = category.toUpperCase();
                wrapper.userData.baseScale = new THREE.Vector3(1, 1, 1); 
                wrapper.add(rawGroup);

                shoeModules[category] = wrapper;
                shoe.add(wrapper);
            } else {
                rawGroup.userData.category = category;
                rawGroup.userData.name = category.toUpperCase();
                rawGroup.userData.baseScale = rawGroup.scale.clone();
                shoeModules[category] = rawGroup;
                shoe.add(rawGroup);
            }

            let targetGroup = isMonolithic ? rawGroup : shoeModules[category];
            
            targetGroup.traverse(node => {
                if(node.isMesh) {
                    node.castShadow = true; node.receiveShadow = true;
                    let originalColor = node.material && node.material.color ? node.material.color : 0xffffff;
                    node.material = new THREE.MeshStandardMaterial({ color: originalColor, roughness: 0.6, metalness: 0.1, side: THREE.DoubleSide });
                    node.userData.baseScale = node.scale.clone();
                    node.userData.parentModule = targetGroup; 
                    
                    if (isMonolithic) {
                        let n = node.name.toUpperCase();
                        if(n.includes('SOLE') || n.includes('BOTTOM')) node.userData.category = 'sole';
                        else if(n.includes('LACE') || n.includes('AGLET')) node.userData.category = 'laces';
                        else node.userData.category = 'upper';
                    } else {
                        node.userData.category = category;
                    }
                    selectableParts.push(node); 
                }
            });

            partMaterials[category] = 0; 
            checkAllLoaded();
            
        }, undefined, (e) => {
            if (filename === 'laces.glb') {
                console.warn('No laces found. Skipping gracefully.');
                let emptyLaces = new THREE.Group();
                emptyLaces.userData.category = 'laces';
                emptyLaces.userData.targetY = 0;
                shoeModules['laces'] = emptyLaces;
                shoe.add(emptyLaces);
            } else {
                triggerRedAlert("404 ERROR: Could not find <b>" + filename + "</b>.");
            }
            checkAllLoaded();
        });
    };

    // --- ARCHITECTURE BRANCHING ---
    if (currentMode === 'template' || currentMode === 'advanced') {
        loadModule('updatedshoe.glb', 'sole', true); 
    } else if (currentMode === 'designer') {
        loadModule('sole 1.gltf', 'sole', false);
        loadModule('upper.gltf', 'upper', false);
        loadModule('laces.glb', 'laces', false); 
    }

    manager.onProgress = (url, itemsLoaded, itemsTotal) => { document.getElementById('progress-bar').style.width = Math.floor((itemsLoaded / itemsTotal) * 100) + '%'; };
    
    window.updateStackTargets = function() {
        if (currentMode !== 'designer' || !shoeModules.sole || !shoeModules.upper) return;
        
        shoeModules.sole.updateMatrixWorld(true);
        let soleBox = new THREE.Box3().setFromObject(shoeModules.sole);
        
        let rawUpper = shoeModules.upper.children[0];
        if (!rawUpper) return;
        rawUpper.updateMatrixWorld(true);
        let upperBox = new THREE.Box3().setFromObject(rawUpper);
        
        let soleHeight = soleBox.max.y - soleBox.min.y;
        let upperHeight = upperBox.max.y - upperBox.min.y;
        
        let stackY = (soleHeight / 2) + (upperHeight / 2) - 0.05; 
        
        shoeModules.upper.userData.targetY = stackY;
        
        if (shoeModules.laces && shoeModules.laces.children.length > 0) {
            let rawLaces = shoeModules.laces.children[0];
            rawLaces.updateMatrixWorld(true);
            let lacesBox = new THREE.Box3().setFromObject(rawLaces);
            let lacesHeight = lacesBox.max.y - lacesBox.min.y;
            shoeModules.laces.userData.targetY = stackY + (upperHeight / 2) + (lacesHeight / 2) - 0.05;
        }
    };

    function finalizeEngineSetup() {
        if (currentMode === 'designer' && shoeModules.sole && shoeModules.upper) {
            window.updateStackTargets();
            shoeModules.upper.position.y = shoeModules.upper.userData.targetY;
            if(shoeModules.laces) shoeModules.laces.position.y = shoeModules.laces.userData.targetY;
        }

        const combinedBox = new THREE.Box3().setFromObject(shoe);
        if(!combinedBox.isEmpty()) {
            const center = combinedBox.getCenter(new THREE.Vector3());
            const size = combinedBox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            if (maxDim > 0 && maxDim !== Infinity && !isNaN(maxDim)) {
                const scale = 8 / maxDim;
                shoe.scale.set(scale, scale, scale);
                shoe.position.sub(center.multiplyScalar(scale));
                shoe.position.y += 0.5;
                shoe.position.x -= 1.5; 
                shoe.updateMatrixWorld(true);
            }
        }

        selectableParts.forEach(p => {
            p.userData.basePos = p.position.clone();
            p.userData.targetY = p.position.y;
            
            if (currentMode === 'designer' && p.userData.category !== 'sole') {
                p.visible = false; 
            } else {
                p.visible = true; 
            }
        });

        const loadScreen = document.getElementById('loading-screen');
        loadScreen.style.opacity = '0';
        setTimeout(() => { 
            loadScreen.style.display = 'none'; 
            if(currentMode === 'designer') {
                showToast("Studio locked to Dynamic Math Assembly.");
                designerStep(0); 
            } else {
                document.getElementById('instruction-text').style.display = 'block';
                showToast(currentMode.toUpperCase() + " Mode Active.");
            }
        }, 500);
    }

    renderer.domElement.addEventListener('pointermove', (e) => {
        if (e.buttons > 0) return; 
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        let validMeshes = selectableParts.filter(p => p.visible !== false);
        const hits = raycaster.intersectObjects(validMeshes, true);

        if (hoveredPart && hoveredPart !== activePart) hoveredPart.material.emissive.setHex(0x000000);
        
        if (hits.length > 0) {
            hoveredPart = hits[0].object; 
            container.style.cursor = 'crosshair';
            if (hoveredPart !== activePart) hoveredPart.material.emissive.setHex(0x222222);
        } else {
            hoveredPart = null;
            container.style.cursor = 'default';
        }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
        if (e.button !== 0) return; 
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        let validMeshes = selectableParts.filter(p => p.visible !== false);
        const hits = raycaster.intersectObjects(validMeshes, true);
        
        if (hits.length > 0) selectPart(hits[0].object);
    });

    if (!window.animationLoopRunning) {
        window.animationLoopRunning = true;
        animate();
    }
}

function selectPart(target) {
    if(activePart) activePart.material.emissive.setHex(0x000000);
    activePart = target; 
    
    activePart.material.emissive.setHex(0x555555);
    setTimeout(() => { if(activePart) activePart.material.emissive.setHex(0x333333); }, 200);

    document.getElementById('instruction-text').style.display = 'none';
    document.getElementById('shared-tools').style.display = 'block';
    
    document.getElementById('native-color-picker').value = "#" + activePart.material.color.getHexString();
    clearColorSelections();
    
    if(currentMode === 'advanced' || currentMode === 'designer') {
        document.getElementById('cad-sliders').style.display = 'block';
        
        let targetMod = activePart;
        if (currentMode === 'designer' && activePart.userData.parentModule) {
            targetMod = activePart.userData.parentModule;
        }
        
        if (!targetMod || !targetMod.scale) return; 
        if (!targetMod.userData.baseScale) targetMod.userData.baseScale = new THREE.Vector3(1, 1, 1);
        
        document.getElementById('scale-x').value = targetMod.scale.x / targetMod.userData.baseScale.x;
        document.getElementById('scale-y').value = targetMod.scale.y / targetMod.userData.baseScale.y;
        document.getElementById('scale-z').value = targetMod.scale.z / targetMod.userData.baseScale.z;
        
        updateSliderText();
        runSafetyEngine(document.getElementById('scale-y').value, 'y');
    }
    
    const displayBox = document.getElementById('active-part-display');
    let niceName = activePart.name.replace(/_/g, ' ');
    if (niceName.includes('Mesh')) niceName = activePart.userData.category.toUpperCase() + " SECTION";
    displayBox.innerText = "EDITING: " + niceName;
    displayBox.classList.add('active-state');
}

function designerStep(direction) {
    designerCurrentStep += direction;
    
    document.getElementById('ds-p1').classList.remove('active');
    document.getElementById('ds-p2').classList.remove('active');
    document.getElementById('ds-p3').classList.remove('active');
    document.getElementById('shared-tools').style.display = 'block';

    let dropOffset = 8; 

    if(designerCurrentStep === 1) {
        document.getElementById('ds-p1').classList.add('active');
        document.getElementById('ds-title').innerText = "1. Construct Sole";
        document.getElementById('ds-prev').style.display = 'none';
        document.getElementById('ds-next').innerText = "Next Phase";
        document.getElementById('ds-upper-tools').style.display = 'none';
        document.getElementById('cad-sliders').style.display = 'block'; 
        
        camera.position.set(-1.5, 2, 10); 
        controls.target.set(-1.5, 0, 0);
        controls.update();

        showToast("Loading Modular Sole...");
        
        if (shoeModules.sole) {
            shoeModules.sole.userData.targetY = 0; 
            shoeModules.sole.position.y = dropOffset; 
        }

        let first = null;
        selectableParts.forEach(p => {
            if(p.userData.category === 'sole') {
                p.visible = true;
                if(!first) first = p;
            } else {
                p.visible = false;
            }
        });
        if(first) selectPart(first);
    } 
    else if (designerCurrentStep === 2) {
        document.getElementById('ds-p1').classList.add('active');
        document.getElementById('ds-p2').classList.add('active');
        document.getElementById('ds-title').innerText = "2. Construct Upper";
        document.getElementById('ds-prev').style.display = 'block';
        document.getElementById('ds-next').innerText = "Next Phase";
        document.getElementById('ds-upper-tools').style.display = 'block'; 
        document.getElementById('cad-sliders').style.display = 'block'; 
        
        camera.position.set(8, 6, 8); 
        controls.target.set(-1.5, 1, 0);
        controls.update();
        
        showToast("Loading Modular Upper...");

        if (shoeModules.upper) {
            window.updateStackTargets();
            shoeModules.upper.position.y = shoeModules.upper.userData.targetY + dropOffset; 
        }

        let first = null;
        selectableParts.forEach(p => {
            if(p.userData.category === 'upper') {
                p.visible = true;
                if(!first) first = p;
            }
        });
        if(first) selectPart(first);
    }
    else if (designerCurrentStep === 3) {
        document.getElementById('ds-p1').classList.add('active');
        document.getElementById('ds-p2').classList.add('active');
        document.getElementById('ds-p3').classList.add('active');
        document.getElementById('ds-title').innerText = "3. Accents & Details";
        document.getElementById('ds-next').innerText = "Finish Design";
        document.getElementById('ds-upper-tools').style.display = 'none';
        document.getElementById('cad-sliders').style.display = 'none'; 
        
        camera.position.set(-1.5, 10, 2); 
        controls.target.set(-1.5, 0, 0);
        controls.update();
        
        showToast("Loading Accessories...");

        if (shoeModules.laces && shoeModules.laces.children.length > 0) {
            shoeModules.laces.position.y = shoeModules.laces.userData.targetY + dropOffset; 
        }

        let first = null;
        selectableParts.forEach(p => {
            if(p.userData.category === 'laces') {
                p.visible = true;
                if(!first) first = p;
            }
        });
        if(first) {
            selectPart(first);
        } else {
             let u = selectableParts.find(p => p.userData.category === 'upper');
             if(u) selectPart(u);
        }
    }
    else if (designerCurrentStep > 3) {
        showCheckout();
        designerCurrentStep = 3; 
    }
}

window.simulateHighTop = (type, btn) => {
    if(!activePart) return;
    document.querySelectorAll('#ds-upper-tools .mat-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    
    if(type === 'high') {
        if(shoeModules.upper) {
            shoeModules.upper.scale.y = shoeModules.upper.userData.baseScale.y * 1.5;
            shoeModules.upper.userData.targetY += 0.8; 
            showToast("Upper chassis extended to High Top profile.");
        }
    } else {
        if(shoeModules.upper) {
            shoeModules.upper.scale.y = shoeModules.upper.userData.baseScale.y;
            shoeModules.upper.userData.targetY -= 0.8;
            showToast("Upper chassis restored to Low Top profile.");
        }
    }
};

window.applyScale = (axis, value) => {
    if(!activePart) return;
    const newScale = parseFloat(value);
    
    let targetMod = activePart;
    if (currentMode === 'designer' && activePart.userData.parentModule) {
        targetMod = activePart.userData.parentModule;
    }
    
    if (!targetMod || !targetMod.scale) return;
    if (!targetMod.userData.baseScale) targetMod.userData.baseScale = new THREE.Vector3(1, 1, 1);
    
    targetMod.scale[axis] = targetMod.userData.baseScale[axis] * newScale;
    updateSliderText();
    
    if(currentMode === 'designer' && targetMod === shoeModules.sole && axis === 'y') {
        showToast("Chassis realigning to sync with new sole volume.");
        window.updateStackTargets();
    } 
    else if (currentMode !== 'designer' && activePart.userData.category === 'sole' && axis === 'y') {
        showToast("Chassis realigning to sync with new sole volume.");
        const delta = (newScale - 1) * 0.4; 
        selectableParts.forEach(node => {
            if(node.userData.category !== 'sole') {
                node.userData.targetY = node.userData.basePos.y + delta;
            }
        });
    }
    
    runSafetyEngine(newScale, axis);
};

function updateSliderText() {
    document.getElementById('val-x').innerText = document.getElementById('scale-x').value;
    document.getElementById('val-y').innerText = document.getElementById('scale-y').value;
    document.getElementById('val-z').innerText = document.getElementById('scale-z').value;
}

function runSafetyEngine(scaleVal, axis) {
    const readout = document.getElementById('safety-readout');
    let cat = activePart.userData.category;
    if(cat === 'sole') {
        if(userActivity === 'running' && scaleVal < 0.8) {
            readout.className = "warning"; readout.innerHTML = "<b>STRUCTURAL ALERT:</b><br>Sole thickness too low for Distance Running."; return;
        } else if (userPronation === 'overpronation' && scaleVal < 1.05) {
            readout.className = "warning"; readout.innerHTML = "<b>BIOMECHANICAL ALERT:</b><br>Overpronation detected. Increase sole thickness (Y > 1.05)."; return;
        }
    }
    readout.className = ""; readout.innerHTML = "SYS.CHECK: Biomechanics Nominal.<br>Structure within safe limits.";
}

function clearColorSelections() {
    document.querySelectorAll('.color-swatch').forEach(sw => sw.classList.remove('selected'));
    document.getElementById('gradient-btn').classList.remove('selected');
}
window.applyCuratedColor = (hex, element) => { 
    if(activePart) { 
        activePart.material.color.set(hex);
        clearColorSelections(); element.classList.add('selected'); 
    }
};
window.applyCustomColor = (hex) => { 
    if(activePart) { 
        activePart.material.color.set(hex);
        clearColorSelections(); document.getElementById('gradient-btn').classList.add('selected'); 
    }
};

window.applyMaterial = (type, element) => {
    if(!activePart) return;
    document.querySelectorAll('#mat-container .mat-btn').forEach(btn => btn.classList.remove('selected'));
    element.classList.add('selected');

    let r = 0.6, m = 0.1, p = 0;
    if (type === 'glossy') { r = 0.15; m = 0.4; p = 10; } 
    else if (type === 'foam') { r = 0.95; m = 0.0; p = 15; }

    activePart.material.roughness = r; 
    activePart.material.metalness = m;
    partMaterials[activePart.name] = p;
    calculatePrice();
};

function generateTextures() {
    const cCanvas = document.createElement('canvas'); cCanvas.width = 256; cCanvas.height = 256;
    const ctx1 = cCanvas.getContext('2d'); ctx1.fillStyle = '#888'; ctx1.fillRect(0,0,256,256); ctx1.fillStyle = '#000';
    for(let i=0; i<256; i+=16) { for(let j=0; j<256; j+=16) { ctx1.beginPath(); ctx1.arc(i+8, j+8, 5, 0, Math.PI*2); ctx1.fill(); } }
    proceduralTextures['carbon'] = new THREE.CanvasTexture(cCanvas);
    proceduralTextures['carbon'].wrapS = proceduralTextures['carbon'].wrapT = THREE.RepeatWrapping; proceduralTextures['carbon'].repeat.set(10, 10);

    const rCanvas = document.createElement('canvas'); rCanvas.width = 256; rCanvas.height = 256;
    const ctx2 = rCanvas.getContext('2d'); ctx2.fillStyle = '#888'; ctx2.fillRect(0,0,256,256); ctx2.fillStyle = '#222';
    for(let i=0; i<256; i+=32) { ctx2.fillRect(0, i, 256, 16); }
    proceduralTextures['ribbed'] = new THREE.CanvasTexture(rCanvas);
    proceduralTextures['ribbed'].wrapS = proceduralTextures['ribbed'].wrapT = THREE.RepeatWrapping; proceduralTextures['ribbed'].repeat.set(5, 5);
}

window.applyTexture = (type, element) => {
    if(!activePart) return;
    document.querySelectorAll('#advanced-textures .mat-btn').forEach(btn => btn.classList.remove('selected'));
    element.classList.add('selected');

    let map = type === 'smooth' ? null : proceduralTextures[type];
    activePart.material.bumpMap = map;
    if(map) activePart.material.bumpScale = 0.05;
    activePart.material.needsUpdate = true;
};

function calculatePrice() {
    let matUpcharges = 0;
    for (let key in partMaterials) { matUpcharges += partMaterials[key]; }
    let total = basePrice + matUpcharges;
    if (currentMode === 'advanced') total += 50; 
    if (currentMode === 'designer') total += 80;
    document.getElementById('price-tag').innerText = "$" + total;
    return { base: basePrice, mats: matUpcharges, total: total };
}

window.showCheckout = () => {
    const p = calculatePrice();
    document.getElementById('receipt-materials').querySelector('span:nth-child(2)').innerText = "$" + p.mats.toFixed(2);
    document.getElementById('receipt-advanced').style.display = currentMode === 'advanced' ? 'flex' : 'none';
    document.getElementById('receipt-designer').style.display = currentMode === 'designer' ? 'flex' : 'none';
    document.getElementById('receipt-total').innerText = "$" + p.total.toFixed(2);
    const modal = document.getElementById('checkout-modal');
    modal.style.display = 'flex'; setTimeout(() => { modal.classList.add('visible'); }, 10);
};

window.closeCheckout = () => {
    const modal = document.getElementById('checkout-modal');
    modal.classList.remove('visible'); setTimeout(() => { modal.style.display = 'none'; }, 300);
};

window.takeSnapshot = () => {
    const panel = document.getElementById('configurator-panel');
    const snapBtn = document.getElementById('snapshot-btn');
    panel.style.display = 'none'; snapBtn.style.display = 'none';
    
    if(activePart) activePart.material.emissive.setHex(0x000000);

    setTimeout(() => {
        renderer.render(scene, camera);
        const link = document.createElement('a');
        link.download = 'Footlabs_Design.png'; link.href = renderer.domElement.toDataURL('image/png'); link.click();
        
        panel.style.display = 'flex'; snapBtn.style.display = 'flex';
        if(activePart) activePart.material.emissive.setHex(0x333333);
    }, 150);
};

function animate() {
    requestAnimationFrame(animate);
    
    if (currentMode === 'designer') {
        Object.values(shoeModules).forEach(mod => {
            if (mod && mod.visible !== false && mod.userData.targetY !== undefined) {
                if (Math.abs(mod.position.y - mod.userData.targetY) > 0.005) {
                    mod.position.y += (mod.userData.targetY - mod.position.y) * 0.15;
                }
            }
        });
    } else {
        selectableParts.forEach(p => {
            if (p.visible !== false && p.userData.targetY !== undefined) {
                if (Math.abs(p.position.y - p.userData.targetY) > 0.005) {
                    p.position.y += (p.userData.targetY - p.position.y) * 0.15;
                }
            }
        });
    }
    
    if(controls) controls.update(); 
    if(renderer && scene && camera) renderer.render(scene, camera);
}

// 🧠 RESIZE CRASH GUARD
window.addEventListener('resize', () => {
    const container = document.getElementById('canvas-container');
    if(!container || !camera || !renderer) return; 
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
